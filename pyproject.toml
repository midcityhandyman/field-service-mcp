[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "field-service-mcp"
version = "0.1.0"
description = "MCP server that exposes a field service management system to agents through a vendor adapter interface, with a bundled offline mock API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
field-service-mcp = "field_service_mcp.server:main"
field-service-mock-api = "field_service_mcp.mock_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/field_service_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
